[build-system]
requires = ["setuptools>=70,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "coastaldrive"
version = "0.8.3"
description = "A stylized-realistic Python coastal road driving game"
requires-python = ">=3.14,<3.15"
dependencies = [
    "panda3d==1.10.16",
    "panda3d-simplepbr==0.13.1",
    "panda3d-gltf==1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
