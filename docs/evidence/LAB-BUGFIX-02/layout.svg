<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f3efe3"/>
<style>text{font:18px 'Microsoft YaHei',sans-serif;fill:#102b3a}.small{font-size:14px}.card{fill:#fefcf5;stroke:#ccd6d2;stroke-width:2}.guide{fill:none;stroke:#247e96;stroke-dasharray:6 5}</style>
<rect x="20" y="10" width="1240" height="70" rx="10" class="card"/><text x="42" y="52">COASTAL DRIVE　车辆实验室</text><text x="810" y="52">参数说明　　返回驾驶　　记录</text>
<rect x="20" y="95" width="265" height="485" rx="12" class="card"/><text x="42" y="130">试验配置</text>
